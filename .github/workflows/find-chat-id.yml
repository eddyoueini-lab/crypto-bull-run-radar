
name: Diagnose Telegram Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN GitHub secret."
            exit 1
          fi

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            -o /tmp/webhook.json

          python - <<'PY'
          import json

          with open("/tmp/webhook.json") as f:
              data = json.load(f)

          if not data.get("ok"):
              raise SystemExit("Telegram API request failed.")

          info = data["result"]
          print("Webhook configured:", bool(info.get("url")))
          print("Pending updates:", info.get("pending_update_count", 0))
          print("Last webhook error:",
                info.get("last_error_message") or "None")
          PY
