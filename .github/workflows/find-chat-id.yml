
name: Find Telegram Channel ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve channel ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            -o /tmp/telegram-updates.json

          python - <<'PY'
          import json

          with open("/tmp/telegram-updates.json") as f:
              data = json.load(f)

          if not data.get("ok"):
              raise SystemExit("Telegram API request failed.")

          found = set()

          for update in data.get("result", []):
              post = update.get("channel_post") or \
                     update.get("edited_channel_post")

              if post:
                  chat = post.get("chat", {})
                  if chat.get("type") == "channel":
                      item = (
                          str(chat.get("id")),
                          chat.get("title", "Unknown"),
                      )
                      if item not in found:
                          found.add(item)
                          print(f"Channel: {item[1]}")
                          print(f"Chat ID: {item[0]}")

          if not found:
              print(
                  "No channel posts found. Publish a fresh "
                  "channel message and run this workflow again."
              )
          PY
