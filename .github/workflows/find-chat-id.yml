
name: Find Telegram Channel ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Find channel ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            -o /tmp/updates.json

          python - <<'PY'
          import json

          with open("/tmp/updates.json") as f:
              data = json.load(f)

          if not data.get("ok"):
              raise SystemExit("Telegram API request failed.")

          found = set()

          for update in data.get("result", []):
              post = (
                  update.get("channel_post")
                  or update.get("edited_channel_post")
              )

              if post:
                  chat = post.get("chat", {})
                  if chat.get("type") == "channel":
                      found.add((
                          str(chat.get("id")),
                          chat.get("title", "Unknown")
                      ))

          if found:
              for chat_id, title in sorted(found):
                  print("Channel:", title)
                  print("Chat ID:", chat_id)
          else:
              print("No channel posts found in pending updates.")
          PY
